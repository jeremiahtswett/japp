# Your job-search profile.
# `japp init` copies this to profile.yaml in the project root — edit THAT copy.
# profile.yaml is gitignored: it never leaves your machine.
# Every value containing REPLACE ME must be filled in before the pipeline will run.

# Titles you're targeting, including acceptable variants. Used by the
# deterministic filter (a posting must roughly match one) and by the LLM scorer.
target_titles:
  - "REPLACE ME e.g. Product Manager"
  - "REPLACE ME e.g. Senior Product Manager"
  - "REPLACE ME e.g. Technical Program Manager"

# Free text, e.g. "mid to senior, 4-8 years experience"
seniority: "REPLACE ME"

# Locations you'd accept for non-remote roles.
locations:
  - "REPLACE ME e.g. Boston, MA"
remote_ok: true
hybrid_ok: true
onsite_ok: false

# One line the scorer can use to judge authorization-related requirements.
work_authorization: "REPLACE ME e.g. US citizen, no sponsorship needed"

# Companies to never surface / to prioritize (matched case-insensitively).
company_blocklist: []
company_priority: []

# Used by the LLM scorer in M1 (until the resume corpus is parsed in M2).
# 3-6 honest sentences: your experience, core skills, tools, domains,
# and what kind of role you want next.
skills_summary: >-
  REPLACE ME

scoring:
  model: claude-haiku-4-5
  immediate_alert_threshold: 80   # score >= this AND fresh -> immediate email
  digest_floor: 60                # score >= this -> included in daily digest
  freshness_hours: 24             # "fresh" = posted within this window
  max_jd_chars: 8000              # JD text is trimmed to this before scoring

discovery:
  poll_interval_hours: 2          # be a polite client; don't go below 1
  max_age_days: 14                # ignore postings older than this

notifications:
  digest_hour_local: 8            # hour of day the digest run is meant for

daily_application_cap: 15         # governs M2+; recorded here from the start
