[project]
name = "japp"
version = "0.1.0"
description = "Personal job-application pipeline: discovery, scoring, tailoring (M1+M2)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "python-docx>=1.1",
]

[project.scripts]
japp = "japp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["japp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
